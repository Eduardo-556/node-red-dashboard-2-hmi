name: publish

# Publishes to npm when main has a version that is not on npm yet.
# Uses npm trusted publishing (no token): on npmjs.com, package Settings >
# Trusted publisher > GitHub Actions, repository Eduardo-556/node-red-dashboard-2-hmi,
# workflow publish.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Version already on npm?
        id: check
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "node-red-dashboard-2-hmi@$V" version >/dev/null 2>&1; then
            echo "Version $V is already on npm"
            echo "new=no" >> "$GITHUB_OUTPUT"
          else
            echo "new=yes" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.new == 'yes'
        run: npm install --no-audit --no-fund
      - if: steps.check.outputs.new == 'yes'
        run: npm test
      - if: steps.check.outputs.new == 'yes'
        name: Built files are committed
        run: npm run build && git diff --exit-code resources
      - if: steps.check.outputs.new == 'yes'
        run: npm publish --access public
