<script src="resources/node-red-dashboard-2-hmi/hmi-editor.js"></script>


<script type="text/javascript">
(function () {

    function authHeaders () {
        const t = RED.settings.get('auth-tokens') || {}
        return t.access_token ? { Authorization: (t.token_type || 'Bearer') + ' ' + t.access_token } : {}
    }

    // URL of the dashboard page that shows this canvas
    function dashboardUrl (node) {
        const scope = $('#node-input-scope').val()
        let pageId = $('#node-input-page').val()
        if (scope === 'group') {
            const g = RED.nodes.node($('#node-input-group').val())
            pageId = g && g.page
        }
        const page = RED.nodes.node(pageId)
        const base = page && RED.nodes.node(page.ui)
        if (!page || !base) return null
        const trim = s => String(s || '').replace(/^\/+|\/+$/g, '')
        const parts = []
        const httpRoot = RED.settings.httpNodeRoot
        if (httpRoot && typeof httpRoot === 'string' && httpRoot !== '/') parts.push(trim(httpRoot))
        parts.push(trim(base.path || 'dashboard'))
        parts.push(trim(page.path))
        return new URL('/' + parts.filter(Boolean).join('/'), window.location.origin)
    }

    function openInDashboard (node, editor) {
        if (editor._dirty || node.changed || !node.symbols) {
            RED.notify('Clique em Concluído e faça o Deploy antes de editar no dashboard.', 'warning')
            return
        }
        const url = dashboardUrl(node)
        if (!url) {
            RED.notify('Escolha a página do dashboard e faça o Deploy.', 'warning')
            return
        }
        $.ajax({
            url: 'hmi-canvas/' + encodeURIComponent(node.id) + '/edit',
            type: 'PATCH',
            headers: authHeaders(),
            success: function (data) {
                url.searchParams.set('hmi-canvas', node.id)
                url.searchParams.set('hmi-edit', data.key)
                url.searchParams.set('hmi-admin', new URL('hmi-canvas/', window.location.href).pathname)
                window.open(url.toString(), 'hmi-edit-' + node.id)
            },
            error: function (xhr) {
                const nd = xhr.responseJSON && xhr.responseJSON.code === 'NOT_DEPLOYED'
                RED.notify(nd ? 'Faça o Deploy antes de editar no dashboard.' : 'Não foi possível abrir: ' + (xhr.responseText || xhr.status), 'error')
            }
        })
    }

    function startEditor (node) {
        const H = window.HmiEditor
        const root = document.getElementById('hmi-ed')
        if (!H) {
            root.textContent = 'Could not load resources/node-red-dashboard-2-hmi/hmi-editor.js'
            return null
        }
        const editor = H.createEditor(root, {
            symbols: node.symbols,
            buttonClass: 'red-ui-button',
            getView: () => ({ w: $('#node-input-viewW').val(), h: $('#node-input-viewH').val() }),
            getTheme: () => $('#node-input-theme').val(),
            getBackground: () => $('#node-input-background').val(),
            getLocale: () => $('#node-input-locale').val(),
            onChange: () => { editor._dirty = true },
            actions: [
                { label: 'Tela cheia', title: 'Abrir este editor na tela toda', onClick: ed => ed.toggleFull() },
                { label: 'Editar no dashboard', title: 'Abrir a página do dashboard em outra aba, em modo de edição', onClick: () => openInDashboard(node, editor) }
            ]
        })
        $('#node-input-theme, #node-input-background, #node-input-viewW, #node-input-viewH, #node-input-locale').on('change input', () => editor.redraw())
        return editor
    }

    RED.nodes.registerType('ui-hmi-canvas', {
        category: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.label.category'),
        color: RED._('@flowfuse/node-red-dashboard/ui-base:ui-base.colors.light'),
        defaults: {
            name: { value: '' },
            scope: { value: 'page' },
            page: {
                type: 'ui-page',
                required: false,
                validate: function (v) { return (this.scope || 'page') !== 'page' || !!v }
            },
            group: {
                type: 'ui-group',
                required: false,
                validate: function (v) { return this.scope !== 'group' || !!v }
            },
            fit: { value: 'screen' },
            order: { value: 0 },
            width: {
                value: 0,
                validate: function (v) {
                    const width = v || 0
                    if (this.scope !== 'group') return true
                    const currentGroup = $('#node-input-group').val() || this.group
                    const groupNode = RED.nodes.node(currentGroup)
                    const valid = !groupNode || +width <= +groupNode.width
                    $('#node-input-size').toggleClass('input-error', !valid)
                    return valid
                }
            },
            height: { value: 0 },
            viewW: { value: 1280, required: true, validate: RED.validators.number() },
            viewH: { value: 720, required: true, validate: RED.validators.number() },
            theme: { value: 'isa101' },
            background: { value: 'theme' },
            offlineAfter: { value: 10, validate: RED.validators.number(true) },
            locale: { value: 'pt-BR' },
            symbols: { value: [] }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-industry',
        paletteLabel: 'hmi canvas',
        label: function () {
            return this.name || 'hmi canvas'
        },
        oneditprepare: function () {
            if (!this.scope) {
                // 0.0.1 flows only had a group
                this.scope = this.group && !this.page ? 'group' : 'page'
                $('#node-input-scope').val(this.scope)
            }
            $('#node-input-scope').on('change', function () {
                const g = $(this).val() === 'group'
                $('.hmi-row-group').toggle(g)
                $('.hmi-row-page').toggle(!g)
            }).trigger('change')
            $('#node-input-size').elementSizer({
                width: '#node-input-width',
                height: '#node-input-height',
                group: '#node-input-group'
            })
            this._hmiEditor = startEditor(this)
        },
        oneditsave: function () {
            const ed = this._hmiEditor
            if (ed) this.symbols = ed.getSymbols()
            delete this._hmiEditor
            if ($('#node-input-scope').val() === 'group') $('#node-input-page').val('_ADD_')
            else $('#node-input-group').val('_ADD_')
        },
        oneditcancel: function () {
            delete this._hmiEditor
        }
    })
})()
</script>

<script type="text/html" data-template-name="ui-hmi-canvas">
    <div class="form-row">
        <label for="node-input-scope"><i class="fa fa-desktop"></i> Show in</label>
        <select id="node-input-scope" style="width: 200px">
            <option value="page">Página inteira</option>
            <option value="group">Grupo</option>
        </select>
    </div>
    <div class="form-row hmi-row-page">
        <label for="node-input-page"><i class="fa fa-file-o"></i> Page</label>
        <input type="text" id="node-input-page">
    </div>
    <div class="form-row hmi-row-group">
        <label for="node-input-group"><i class="fa fa-table"></i> Group</label>
        <input type="text" id="node-input-group">
    </div>
    <div class="form-row hmi-row-group">
        <label><i class="fa fa-object-group"></i> Size</label>
        <input type="hidden" id="node-input-width">
        <input type="hidden" id="node-input-height">
        <button class="editor-button" id="node-input-size"></button>
    </div>
    <div class="form-row">
        <label for="node-input-viewW"><i class="fa fa-arrows-alt"></i> Screen</label>
        <input type="number" id="node-input-viewW" style="width: 90px"> ×
        <input type="number" id="node-input-viewH" style="width: 90px"> px
    </div>
    <div class="form-row">
        <label for="node-input-fit"><i class="fa fa-expand"></i> Fit</label>
        <select id="node-input-fit" style="width: 200px">
            <option value="screen">Caber na tela</option>
            <option value="width">Largura toda</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-theme"><i class="fa fa-paint-brush"></i> Theme</label>
        <select id="node-input-theme" style="width: 200px">
            <option value="isa101">ISA-101</option>
            <option value="classic">Clássico</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-background"><i class="fa fa-square-o"></i> Background</label>
        <select id="node-input-background" style="width: 200px">
            <option value="theme">Cor do tema</option>
            <option value="transparent">Transparente</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-offlineAfter"><i class="fa fa-chain-broken"></i> Offline after</label>
        <input type="number" id="node-input-offlineAfter" style="width: 90px"> s without data (0 = off)
    </div>
    <div class="form-row">
        <label for="node-input-locale"><i class="fa fa-globe"></i> Number format</label>
        <input type="text" id="node-input-locale" style="width: 90px" placeholder="pt-BR">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
    <div class="form-row">
        <div id="hmi-ed"></div>
    </div>
</script>

<script type="text/html" data-help-name="ui-hmi-canvas">
    <p>A machine screen (HMI) for Dashboard 2.0, built by dragging symbols onto a canvas.</p>
    <h3>Editing</h3>
    <p>Drag a symbol from the bar above the canvas, or click it to add it in the middle. Click a symbol to edit its properties on the right. Drag to move it and use the blue square to resize it. <code>Delete</code> removes the selected symbol, arrow keys move it (Shift = 10 px).</p>
    <p>Each symbol shows the value of its <b>payload key</b>. The test value is only used in the editor preview.</p>
    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">object</span></dt>
        <dd>Values by key, e.g. the output of <code>schneider read</code>: <code>{ "rpm": 1450, "speed": 42.5 }</code>. Keys are merged with the previous values.</dd>
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>With a non-object payload, the value is stored under this key.</dd>
    </dl>
    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">number | boolean | string</span></dt>
        <dd>Sent when a symbol with a click action is clicked on the dashboard: the configured value, the inverted value of its key (toggle), or 1 on press and 0 on release (pulse). Booleans are used when the key currently holds a boolean.</dd>
        <dt>topic <span class="property-type">string</span></dt>
        <dd>The action's topic, or the symbol's payload key when empty.</dd>
        <dt>symbol <span class="property-type">object</span></dt>
        <dd><code>{ id, type, key }</code> of the clicked symbol.</dd>
    </dl>
    <h3>Themes</h3>
    <p><b>Background</b>: <i>Transparente</i> removes the canvas fill so the dashboard page shows through.</p>
    <p><b>ISA-101</b>: grey, flat symbols; colour only for abnormal states and alarms. <b>Clássico</b>: dark theme with animated reels.</p>
</script>
